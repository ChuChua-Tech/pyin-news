name: Validate release package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile backend
        run: python -m py_compile bin/chuchua-news bin/news_images.py bin/news_http.py

      - name: Run release tests
        run: python -m unittest discover -s tests -v

      - name: Check reader event handling
        run: node --test tests/test_reading_ui.cjs

  release-package:
    name: Release version and clean install
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify version and start the exported package
        run: python .github/scripts/check_release.py
