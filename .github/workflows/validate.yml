name: Validate release package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile backend
        run: python -m py_compile bin/chuchua-news bin/news_images.py bin/news_http.py bin/news_ai.py tests/native_ai_contract.py

      - name: Install isolation dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run release tests
        run: python -m unittest discover -s tests -v

      - name: Check reader event handling
        run: node --test tests/test_reading_ui.cjs

  release-package:
    name: Release version and clean install
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify version and start the exported package
        run: python .github/scripts/check_release.py

  native-ai:
    name: Native AI tool and configuration boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "26.8.1"
      - name: Prepare disposable runner isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install the verified native agent versions
        run: |
          npm install --prefix "$RUNNER_TEMP/pyin-agents" --ignore-scripts --no-audit --no-fund @openai/codex@0.153.4 @anthropic-ai/claude-code@2.1.261 @google/gemini-cli@0.58.0 @xai-official/grok@1.0.13
          # Only Claude's package-local native binary placement is required.
          # Grok bootstraps its bundled binary inside the disposable test home.
          node "$RUNNER_TEMP/pyin-agents/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/pyin-agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check tools, private files and personal configuration with fake models
        run: python tests/native_ai_contract.py
